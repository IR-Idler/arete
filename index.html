<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arete: Workout Tracker</title>
  <meta name="description" content="A workout tracker that scores every session against your own baseline.">
  <meta name="theme-color" content="#0B111D">
  <meta property="og:title" content="Arete: Workout Tracker">
  <meta property="og:description" content="Scored against you.">
  <meta property="og:image" content="assets/img/screens/01-promise.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash: the sword is forged left to right, then the name rises. Plays once per visit. -->
  <div class="splash" aria-hidden="true">
    <div class="splash-inner">
      <img class="splash-sword" src="assets/img/swords/bronze.png" alt="">
      <div class="splash-word">ARETE</div>
    </div>
  </div>

  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <div class="wrap">
      <a class="brand" href="./"><img src="assets/img/apple-touch-icon.png" alt="">Arete</a>
      <nav class="nav-links">
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1>Scored against<br><span class="grad">you.</span></h1>
        <p class="lead">A workout tracker that measures every session against your own baseline.</p>
        <div class="cta-row">
          <!-- Replace href with your App Store link once the app is live, e.g. https://apps.apple.com/app/id0000000000 -->
          <a class="btn" href="#screens">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 1.5c.1 1.03-.3 2.06-.9 2.8-.63.76-1.64 1.35-2.64 1.27-.12-1 .37-2.06.95-2.72.65-.75 1.75-1.32 2.59-1.35zM20.5 17.2c-.55 1.27-.82 1.84-1.53 2.96-.99 1.56-2.39 3.5-4.12 3.52-1.54.01-1.93-1-4.02-.99-2.08.01-2.51 1.01-4.05 1-1.73-.02-3.05-1.77-4.04-3.33C-.03 16.04-.32 11 1.44 8.33c1.25-1.9 3.22-3.01 5.07-3.01 1.89 0 3.08 1.04 4.64 1.04 1.52 0 2.44-1.04 4.62-1.04 1.65 0 3.4.9 4.64 2.45-4.08 2.24-3.42 8.07.09 9.43z"/></svg>
            Coming soon to the App Store
          </a>
        </div>
        <div class="hero-sword">
          <img src="assets/img/swords/bronze.png" alt="">
        </div>
      </div>
    </section>

    <section id="screens" class="screens">
      <div class="gallery reveal">
        <div class="phone"><img src="assets/img/screens/02-logger.jpg" alt="Logging sets during a workout" decoding="async"></div>
        <div class="phone"><img src="assets/img/screens/03-baseline.jpg" alt="Baselines established after three sessions" decoding="async"></div>
        <div class="phone"><img src="assets/img/screens/01-promise.jpg" alt="Fitness Level card with the Bronze sword" decoding="async"></div>
        <div class="phone"><img src="assets/img/screens/04-one-number.jpg" alt="Session intensity and volume summary" decoding="async"></div>
        <div class="phone"><img src="assets/img/screens/05-climb.jpg" alt="Progress charts over time" decoding="async"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div>© <span data-year>2026</span> Arete</div>
      <nav>
        <a href="support.html">Support</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Use</a>
      </nav>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>

</html>
